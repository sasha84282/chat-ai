<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ Ассистент</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .prose pre { background: #1e293b !important; padding: 1rem; border-radius: 0.5rem; position: relative; }
    .prose code { color: #38bdf8; font-size: 0.9rem; }
    .prose a { color: #60a5fa; text-decoration: underline; }
    .prose a:hover { color: #93c5fd; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between items-center p-2 sm:p-4 font-sans">

  <div class="w-full max-w-4xl h-full flex flex-col bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    
    <!-- Шапка -->
    <div class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
          <i class="fa-solid font-robot fa-robot"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-100">ИИ Ассистент</h1>
          <p class="text-xs text-slate-400">Работает на базе Gemini API</p>
        </div>
      </div>
      <button onclick="clearChat()" title="Очистить чат" class="px-3 py-2 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded-lg transition">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>

    <!-- Чат сообщения -->
    <div id="chatMessages" class="flex-1 p-4 overflow-y-auto chat-scroll flex flex-col gap-4">
      <div class="flex gap-3 max-w-[85%] self-start">
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-robot text-sm"></i>
        </div>
        <div class="bg-slate-800 border border-slate-700/60 p-3.5 rounded-2xl rounded-tl-sm text-slate-200 text-sm leading-relaxed shadow-sm">
          Здравствуйте! Чем я могу помочь? Вы можете отправлять мне текстовые вопросы, фотографии или PDF-документы.
        </div>
      </div>
    </div>

    <!-- Область предпросмотра прикрепленных файлов -->
    <div id="filePreviewArea" class="hidden px-4 py-2 bg-slate-800/40 border-t border-slate-800 flex items-center gap-2 overflow-x-auto"></div>

    <!-- Область ввода -->
    <div class="p-3 bg-slate-800/60 border-t border-slate-800">
      <div class="flex items-end gap-2 bg-slate-900 border border-slate-700 rounded-xl p-2 focus-within:border-blue-500 transition">
        
        <!-- Кнопка прикрепления файла -->
        <input type="file" id="fileInput" class="hidden" multiple onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('fileInput').click()" title="Прикрепить фото или документ (PDF, DOC)" class="p-2.5 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded-lg transition shrink-0">
          <i class="fa-solid fa-paperclip text-lg"></i>
        </button>

        <!-- Поле ввода -->
        <textarea id="userInput" rows="1" placeholder="Задайте вопрос..." onkeydown="handleKeyDown(event)" class="flex-1 bg-transparent border-none outline-none text-slate-100 placeholder-slate-500 resize-none text-sm min-h-[38px] max-h-32 py-2"></textarea>

        <!-- Кнопка отправки -->
        <button id="sendBtn" onclick="sendMessage()" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      <p class="text-[10px] text-slate-500 text-center mt-2">Разрешены: Фото, PDF, DOC, TXT. Видео, EXE и APK запрещены.</p>
    </div>

  </div>

  <script>
    const API_KEY = 'AQ.Ab8RN6KElvDI84viRpsViVrjxTqsZUM-P-2YfKOmd9K42RhzKQ';
    const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';

    let attachedFiles = [];
    let chatHistory = [];

    // Запрещенные расширения и типы файлов
    const BLOCKED_EXTENSIONS = ['exe', 'apk', 'msi', 'bat', 'cmd', 'sh', 'vbs', 'ps1', 'mp4', 'avi', 'mov', 'mkv', 'webm', 'flv', '3gp', 'wmv'];

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const filePreviewArea = document.getElementById('filePreviewArea');

    // Настройка Marked для ссылок
    marked.setOptions({
      highlight: function(code, lang) {
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      
      files.forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        
        if (BLOCKED_EXTENSIONS.includes(ext) || file.type.startsWith('video/')) {
          alert(`❌ Файл "${file.name}" запрещен! Загрузка видеофайлов, EXE и APK не поддерживается.`);
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(',')[1];
          attachedFiles.push({
            name: file.name,
            type: file.type || 'application/octet-stream',
            data: base64Data,
            preview: file.type.startsWith('image/') ? e.target.result : null
          });
          renderPreviews();
        };
        reader.readAsDataURL(file);
      });

      fileInput.value = '';
    }

    function renderPreviews() {
      if (attachedFiles.length === 0) {
        filePreviewArea.classList.add('hidden');
        filePreviewArea.innerHTML = '';
        return;
      }

      filePreviewArea.classList.remove('hidden');
      filePreviewArea.innerHTML = '';

      attachedFiles.forEach((file, index) => {
        const badge = document.createElement('div');
        badge.className = 'flex items-center gap-2 bg-slate-700/80 border border-slate-600 px-2.5 py-1 rounded-lg text-xs text-slate-200 shrink-0';
        
        if (file.preview) {
          badge.innerHTML = `<img src="${file.preview}" class="w-5 h-5 object-cover rounded"> <span class="max-w-[100px] truncate">${file.name}</span>`;
        } else {
          badge.innerHTML = `<i class="fa-solid fa-file text-blue-400"></i> <span class="max-w-[100px] truncate">${file.name}</span>`;
        }

        const removeBtn = document.createElement('button');
        removeBtn.className = 'text-slate-400 hover:text-rose-400 ml-1';
        removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        removeBtn.onclick = () => {
          attachedFiles.splice(index, 1);
          renderPreviews();
        };

        badge.appendChild(removeBtn);
        filePreviewArea.appendChild(badge);
      });
    }

    function appendUserMessage(text, files = []) {
      const msgContainer = document.createElement('div');
      msgContainer.className = 'flex gap-3 max-w-[85%] self-end flex-row-reverse';

      let filesHTML = '';
      if (files.length > 0) {
        filesHTML = `<div class="flex flex-wrap gap-1.5 mb-2">${files.map(f => `
          <span class="inline-flex items-center gap-1 bg-blue-700/40 text-blue-200 text-xs px-2 py-1 rounded border border-blue-500/30">
            <i class="fa-solid fa-paperclip"></i> ${f.name}
          </span>
        `).join('')}</div>`;
      }

      msgContainer.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-slate-700 text-slate-300 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
        <div class="bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-sm">
          ${filesHTML}
          <div>${escapeHtml(text)}</div>
        </div>
      `;

      chatMessages.appendChild(msgContainer);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendBotMessage() {
      const msgContainer = document.createElement('div');
      msgContainer.className = 'flex gap-3 max-w-[85%] self-start';

      const botContent = document.createElement('div');
      botContent.className = 'bg-slate-800 border border-slate-700/60 p-3.5 rounded-2xl rounded-tl-sm text-slate-200 text-sm leading-relaxed shadow-sm prose prose-invert max-w-none w-full';
      botContent.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i> Думаю...';

      msgContainer.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-robot text-sm"></i>
        </div>
      `;
      msgContainer.appendChild(botContent);

      chatMessages.appendChild(msgContainer);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      return botContent;
    }

    async function fetchWithRetry(url, options, maxRetries = 4, delay = 2000) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(url, options);
          const data = await response.json();

          if (response.ok) return data;

          const errorMsg = data.error?.message || '';
          if (response.status === 503 || errorMsg.includes('high demand') || errorMsg.includes('overloaded')) {
            if (attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 1.5;
              continue;
            }
          }
          throw new Error(errorMsg || 'Ошибка запроса к API');
        } catch (err) {
          if (attempt === maxRetries) throw err;
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text && attachedFiles.length === 0) return;

      const currentFiles = [...attachedFiles];
      appendUserMessage(text, currentFiles);

      // Сброс поля ввода
      userInput.value = '';
      attachedFiles = [];
      renderPreviews();

      userInput.disabled = true;
      sendBtn.disabled = true;

      const botMessageEl = appendBotMessage();

      // Формирование payload для Gemini
      const parts = [];
      if (text) parts.push({ text: text });

      currentFiles.forEach(f => {
        parts.push({
          inlineData: {
            mimeType: f.type,
            data: f.data
          }
        });
      });

      chatHistory.push({ role: 'user', parts: parts });

      try {
        const data = await fetchWithRetry(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': API_KEY
          },
          body: JSON.stringify({ contents: chatHistory })
        });

        const botReplyText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Не удалось получить ответ.';
        
        chatHistory.push({
          role: 'model',
          parts: [{ text: botReplyText }]
        });

        // Отображение ответа с Markdown
        botMessageEl.innerHTML = marked.parse(botReplyText);

        // Добавление кнопки «Скачать в DOC»
        const docBtn = document.createElement('button');
        docBtn.className = 'mt-3 inline-flex items-center gap-1.5 text-xs bg-slate-700/60 hover:bg-slate-700 text-blue-300 px-3 py-1.5 rounded-lg border border-slate-600 transition';
        docBtn.innerHTML = '<i class="fa-solid fa-file-word text-blue-400"></i> Скачать в .DOC';
        docBtn.onclick = () => downloadDoc(botReplyText);
        botMessageEl.appendChild(docBtn);

        // Подсветка кода
        botMessageEl.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

      } catch (err) {
        botMessageEl.innerHTML = `<span class="text-rose-400">Ошибка: ${escapeHtml(err.message)}</span>`;
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function downloadDoc(text) {
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Ответ ИИ</title></head><body>";
      const footer = "</body></html>";
      const htmlContent = header + marked.parse(text) + footer;

      const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ответ_ии.doc';
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearChat() {
      chatHistory = [];
      chatMessages.innerHTML = `
        <div class="flex gap-3 max-w-[85%] self-start">
          <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-robot text-sm"></i>
          </div>
          <div class="bg-slate-800 border border-slate-700/60 p-3.5 rounded-2xl rounded-tl-sm text-slate-200 text-sm leading-relaxed shadow-sm">
            История очищена. Задайте новый вопрос!
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
